# T01a「モデル選定の手順」の結果。infra/deploy.sh はこのファイルからデプロイを作る。
# 途中でモデルを変えた場合は、その時点までの結果を比較に混ぜない。
checked_at: "2026-10-16"
foundry_region: eastus2     # Decision-1 は japaneast / southeastasia では未提供（2026-10-16 確認）
postgres_region: japaneast  # 評価ランナー（手元PC）から近い側に置く。Foundry とは直接通信しない

# 単価は Azure Retail Prices API（eastus2）の値。USD / 100万トークン、ShortContext・Standard
deployments:
  - name: decision-eval
    model: Microsoft-Decision-1
    format: Microsoft
    version: "1"
    sku: DataZoneStandard   # GlobalStandard は未提供
    capacity: 60            # = 1 分あたり 60 リクエスト（クォータ上限）。トークン数ではなくリクエスト数で制限される
    price: {input: 0.042, output: 0}
  - name: embed
    model: text-embedding-3-small
    format: OpenAI
    version: "1"
    sku: GlobalStandard
    capacity: 200
    price: {input: 0.02, output: 0}
  - name: gen
    model: gpt-6-luna
    format: OpenAI
    version: "2026-09-22"
    sku: GlobalStandard
    capacity: 250           # = 1 分あたり 250 リクエスト・25 万トークン（クォータ上限）。構成 E は 1 問 11 回呼ぶ
    reasoning_effort: none
    price: {input: 0.10, output: 0.50}
  - name: judge
    model: gpt-6-sol
    format: OpenAI
    version: "2026-09-22"
    sku: GlobalStandard
    capacity: 250           # = 1 分あたり 250 リクエスト（クォータ上限）
    reasoning_effort: none
    price: {input: 2.00, output: 10.00}
    # Flex 処理（入力 1.00 / 出力 5.00）が使える（T04 で確認、service_tier="flex"）。
    # 即時性の要らない QA 生成と採点は Flex で呼ぶ
    flex_price: {input: 1.00, output: 5.00}
  # ---- 生成モデルの差し替え比較（検索と Decision-1 の判定は最終評価のものを再利用し、回答だけ作り直す）----
  - name: gen-nano
    model: gpt-5-nano
    format: OpenAI
    version: "2025-08-07"
    sku: GlobalStandard
    capacity: 250
    reasoning_effort: minimal  # gpt-5 系は none がないため最小の minimal。推論トークンは出力として課金される
    price: {input: 0.05, output: 0.40}
  - name: gen-phi
    model: Phi-4-mini-instruct
    format: Microsoft
    version: "1"
    sku: GlobalStandard
    capacity: 20               # クォータ上限
    price: {input: 0.075, output: 0.30}

# 参考：不採用の候補（eastus2・GlobalStandard）
#   gpt-5.4-mini  入力 0.75 / 出力 4.50（gen の代替）
#   gpt-5.4       入力 2.50 / 出力 15.00（judge の代替）
