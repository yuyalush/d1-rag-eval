# 構成ごとの検索件数・閾値・判定の質問文（閾値と質問文は T15 で開発用セットを使って調整する）
common:
  max_context_chunks: 5
  decision_concurrency: 4
  decision_rpm: 55            # Decision-1 のデプロイ上限（60 リクエスト/分）より少し下に抑える
  llm_filter_concurrency: 4
  llm_filter_rpm: 200         # gen デプロイの上限（250 リクエスト/分）から回答生成の分を残す

configs:
  a_baseline:
    retrieve_k: 5
  b_d1_filter:
    retrieve_k: 10
    threshold: 0.8             # T15：開発用セットで 0.3〜0.8 を比較し、Recall を保ったまま Precision が最も高い値
  c_d1_gate:
    retrieve_k: 10
    threshold: 0.8
    abstain_on: insufficient   # この選択肢の確率が最大なら回答を控える
  d_d1_rerank:
    retrieve_k: 20
  e_llm_filter:
    retrieve_k: 10

# Decision-1 の質問文（state は {"question": ..., "passage(s)": ...}）
decision_questions:
  relevant:                    # T15 で en_partial を採用（AUC 0.89、Recall 0.716 / Precision 0.420 @0.8）
    type: noul
    instructions: Would this passage help answer the question, even partially?
    criteria:
      "true": The passage contains at least one fact needed for the answer
      "false": The passage does not contain any fact needed for the answer
  sufficiency:
    type: choice
    instructions: Do the passages together contain enough evidence to answer the question?
    criteria:
      sufficient: All parts of the question can be answered from the passages
      partial: Some parts can be answered, others cannot
      insufficient: The passages do not answer the question
      cannot_tell: It is unclear from the passages
  usefulness:
    type: score
    instructions: How useful is this passage for answering the question?
    criteria: [Irrelevant, Related topic only, Partially answers, Fully answers]

# 構成 E：構成 B と同じ判定を gen デプロイ（汎用 LLM）に JSON で答えさせる
llm_filter_prompt: |
  次の文章が、質問に答えるために必要な情報を含むか判定してください。
  - 含む：文章が質問の全部または一部に直接答える事実を述べている
  - 含まない：文章が話題違い、または質問とキーワードが共通するだけ

  # 質問
  {question}

  # 文章
  {passage}

  JSON で出力: {{"relevant": true または false}}
